# pyproject.toml -- embediq-python SDK packaging metadata
#
# Build configuration for `pip install embediq-python`. Zero runtime
# dependencies — the SDK uses stdlib only (struct, socket, threading, os,
# time, dataclasses, typing).
#
# @author  Ritesh Anand
# @company embediq.com | ritzylab.com
#
# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embediq-python"
version = "0.1.0"
description = "Python SDK for EmbedIQ External FBs"
authors = [{name = "Ritesh Anand", email = "dev@ritzylab.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://embediq.com"
Repository = "https://github.com/ritzylab-dev/embediq"

[tool.setuptools.packages.find]
where = ["."]
include = ["embediq*"]
