name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate message catalogs (messages.iq → C headers)
        run: |
          python3 tools/messages_iq/generate.py messages/core.iq \
              --out generated/ --output-name embediq_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/thermostat.iq \
              --out generated/ --output-name thermostat_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --out generated/ --output-name telemetry_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/gateway.iq \
              --out generated/ --output-name gateway_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/provisioning.iq \
              --out generated/ --output-name provisioning_msg_catalog.h

      - name: Verify generated headers match .iq source (drift check)
        run: |
          mkdir -p /tmp/iq_fresh
          python3 tools/messages_iq/generate.py messages/core.iq \
              --out /tmp/iq_fresh/ --output-name embediq_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/thermostat.iq \
              --out /tmp/iq_fresh/ --output-name thermostat_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --out /tmp/iq_fresh/ --output-name telemetry_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/gateway.iq \
              --out /tmp/iq_fresh/ --output-name gateway_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/provisioning.iq \
              --out /tmp/iq_fresh/ --output-name provisioning_msg_catalog.h
          diff generated/embediq_msg_catalog.h /tmp/iq_fresh/embediq_msg_catalog.h
          diff generated/thermostat_msg_catalog.h /tmp/iq_fresh/thermostat_msg_catalog.h
          diff generated/telemetry_msg_catalog.h /tmp/iq_fresh/telemetry_msg_catalog.h
          diff generated/gateway_msg_catalog.h /tmp/iq_fresh/gateway_msg_catalog.h
          diff generated/provisioning_msg_catalog.h /tmp/iq_fresh/provisioning_msg_catalog.h

      - name: Generate config_iq artifacts
        run: |
          python3 tools/config_iq/generate.py config/config.iq \
              --out generated/

      - name: Verify config_iq generated files match schema (drift check)
        run: |
          mkdir -p /tmp/cfg_fresh
          python3 tools/config_iq/generate.py config/config.iq \
              --out /tmp/cfg_fresh/
          diff generated/embediq_cfg_validate.h /tmp/cfg_fresh/embediq_cfg_validate.h
          diff generated/embediq_cfg_generated.h /tmp/cfg_fresh/embediq_cfg_generated.h
          diff generated/embediq_cfg_validate.c   /tmp/cfg_fresh/embediq_cfg_validate.c

      - name: Generate Python message stubs (--lang python)
        run: |
          python3 tools/messages_iq/generate.py messages/core.iq \
              --lang python --out tools/embediq_python/embediq/msgs/
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --lang python --out tools/embediq_python/embediq/msgs/

      - name: Verify Python stubs match .iq source (drift check)
        run: |
          mkdir -p /tmp/py_fresh/
          python3 tools/messages_iq/generate.py messages/core.iq \
              --lang python --out /tmp/py_fresh/
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --lang python --out /tmp/py_fresh/
          diff tools/embediq_python/embediq/msgs/core_msgs.py /tmp/py_fresh/core_msgs.py
          diff tools/embediq_python/embediq/msgs/telemetry_msgs.py /tmp/py_fresh/telemetry_msgs.py

      - name: Python SDK unit tests
        run: python3 tests/python/test_ext_fb.py

      - name: Build (host platform)
        run: |
          cmake -B build -DEMBEDIQ_PLATFORM=host
          cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Static checks (blocking and advisory — see tools/ci/README.md)
        run: bash tools/ci/static_checks.sh

      - name: Compat — v1 API surface (Invariant I-14, only if file exists)
        run: |
          if [ -f tests/compat/fb_v1_compat.c ]; then
            gcc -I core/include -I generated -std=c11 -Wall -Werror \
              -DEMBEDIQ_MSG_MAX_PAYLOAD=64 \
              -c tests/compat/fb_v1_compat.c
          fi

      - name: Install Mosquitto for MQTT tests
        run: sudo apt-get install -y mosquitto

      - name: Install cppcheck for MISRA scan
        run: |
          CPPCHECK_VERSION=$(apt-cache policy cppcheck | grep Candidate | awk '{print $2}')
          echo "Installing cppcheck $CPPCHECK_VERSION"
          sudo apt-get install -y cppcheck

      - name: MISRA-C:2012 scan — warning only (cppcheck, R-02, I-07 adjacent)
        run: python3 tools/ci/check_misra.py

  tsan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate message catalogs (messages.iq → C headers)
        run: |
          python3 tools/messages_iq/generate.py messages/core.iq \
              --out generated/ --output-name embediq_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/thermostat.iq \
              --out generated/ --output-name thermostat_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --out generated/ --output-name telemetry_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/gateway.iq \
              --out generated/ --output-name gateway_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/provisioning.iq \
              --out generated/ --output-name provisioning_msg_catalog.h

      - name: Verify generated headers match .iq source (drift check)
        run: |
          mkdir -p /tmp/iq_fresh
          python3 tools/messages_iq/generate.py messages/core.iq \
              --out /tmp/iq_fresh/ --output-name embediq_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/thermostat.iq \
              --out /tmp/iq_fresh/ --output-name thermostat_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --out /tmp/iq_fresh/ --output-name telemetry_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/gateway.iq \
              --out /tmp/iq_fresh/ --output-name gateway_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/provisioning.iq \
              --out /tmp/iq_fresh/ --output-name provisioning_msg_catalog.h
          diff generated/embediq_msg_catalog.h /tmp/iq_fresh/embediq_msg_catalog.h
          diff generated/thermostat_msg_catalog.h /tmp/iq_fresh/thermostat_msg_catalog.h
          diff generated/telemetry_msg_catalog.h /tmp/iq_fresh/telemetry_msg_catalog.h
          diff generated/gateway_msg_catalog.h /tmp/iq_fresh/gateway_msg_catalog.h
          diff generated/provisioning_msg_catalog.h /tmp/iq_fresh/provisioning_msg_catalog.h

      - name: Generate config_iq artifacts
        run: |
          python3 tools/config_iq/generate.py config/config.iq \
              --out generated/

      - name: Verify config_iq generated files match schema (drift check)
        run: |
          mkdir -p /tmp/cfg_fresh
          python3 tools/config_iq/generate.py config/config.iq \
              --out /tmp/cfg_fresh/
          diff generated/embediq_cfg_validate.h /tmp/cfg_fresh/embediq_cfg_validate.h
          diff generated/embediq_cfg_generated.h /tmp/cfg_fresh/embediq_cfg_generated.h
          diff generated/embediq_cfg_validate.c   /tmp/cfg_fresh/embediq_cfg_validate.c

      - name: Generate Python message stubs (--lang python)
        run: |
          python3 tools/messages_iq/generate.py messages/core.iq \
              --lang python --out tools/embediq_python/embediq/msgs/
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --lang python --out tools/embediq_python/embediq/msgs/

      - name: Verify Python stubs match .iq source (drift check)
        run: |
          mkdir -p /tmp/py_fresh/
          python3 tools/messages_iq/generate.py messages/core.iq \
              --lang python --out /tmp/py_fresh/
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --lang python --out /tmp/py_fresh/
          diff tools/embediq_python/embediq/msgs/core_msgs.py /tmp/py_fresh/core_msgs.py
          diff tools/embediq_python/embediq/msgs/telemetry_msgs.py /tmp/py_fresh/telemetry_msgs.py

      - name: Build (host, ThreadSanitizer)
        run: cmake -B build_tsan -DEMBEDIQ_PLATFORM=host -DEMBEDIQ_TSAN=ON && cmake --build build_tsan

      - name: ThreadSanitizer gate self-check (a deliberate race must be caught)
        run: |
          mkdir -p build_tsan/canary
          cc -std=c11 -fsanitize=thread -g -O1 -o build_tsan/tsan_canary tools/ci/tsan_canary.c -lpthread
          TSAN_OPTIONS="halt_on_error=0 exitcode=0 log_path=$PWD/build_tsan/canary/tsan" ./build_tsan/tsan_canary 2> build_tsan/canary/tsan.stderr
          set +e; python3 tools/ci/tsan_summarise.py build_tsan/canary > build_tsan/canary/summary.txt; rc=$?; set -e
          cat build_tsan/canary/summary.txt
          [ "$rc" -eq 1 ] && grep -q "data race" build_tsan/canary/summary.txt && grep -q "tsan_canary" build_tsan/canary/summary.txt \
            || { echo "gate self-check FAILED: expected exit 1 with a data race in tsan_canary; got exit $rc"; exit 1; }

      # Every test runs to completion and every sanitizer report is written (halt_on_error=0 exitcode=0). A test
      # assertion failure or timeout fails this step; sanitizer findings, unparsed reports, runtime aborts and sanitizer-handled crashes are failed
      # by the summary step below, which always runs.
      - name: Run tests under ThreadSanitizer
        run: TSAN_OPTIONS="halt_on_error=0 exitcode=0 suppressions=$PWD/tools/ci/tsan.supp log_path=$PWD/build_tsan/tsan" ctest --test-dir build_tsan --output-on-failure --timeout 300

      - name: Summarise races
        if: always()
        run: python3 tools/ci/tsan_summarise.py --github build_tsan

      - name: Upload TSan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-reports
          path: |
            build_tsan/tsan.*
            build_tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  release-symbols:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate message catalogs (messages.iq → C headers)
        run: |
          python3 tools/messages_iq/generate.py messages/core.iq \
              --out generated/ --output-name embediq_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/thermostat.iq \
              --out generated/ --output-name thermostat_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/telemetry.iq \
              --out generated/ --output-name telemetry_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/gateway.iq \
              --out generated/ --output-name gateway_msg_catalog.h
          python3 tools/messages_iq/generate.py messages/provisioning.iq \
              --out generated/ --output-name provisioning_msg_catalog.h

      - name: Generate config_iq artifacts
        run: |
          python3 tools/config_iq/generate.py config/config.iq \
              --out generated/

      # Builds the host release profile (test hooks off) and checks every
      # framework library against tools/ci/test_hook_inventory.txt (I-05, R-07).
      - name: No test hooks in the host release build
        run: tools/ci/check_release_symbols.sh

      # The check must reject each of its known failure shapes and accept the
      # unmodified tree; runs in a scratch copy of the checkout.
      - name: Release symbol check self-test
        run: tools/ci/test_check_release_symbols.sh
